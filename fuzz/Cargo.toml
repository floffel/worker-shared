[package]
name = "worker-shared-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
tokio = { version = "1", features = ["rt"] }

[dependencies.worker-shared]
path = ".."
features = ["ddb"]

[[bin]]
name = "eventbridge_envelope"
path = "fuzz_targets/eventbridge_envelope.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sqs_batch"
path = "fuzz_targets/sqs_batch.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ddb_record"
path = "fuzz_targets/ddb_record.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
